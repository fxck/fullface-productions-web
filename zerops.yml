zerops:
  - setup: app
    build:
      base: nodejs@22
      envVariables:
        NODE_OPTIONS: --max_old_space_size=4096
        MY_SERVER_SCRAPER_ENDPOINT: ${RUNTIME_MY_SERVER_SCRAPER_ENDPOINT}
      buildCommands:
        - pnpm i
        - pnpm build
      deployFiles:
        - dist/analog/public~
    run:
      base: static
      envVariables:
        MY_SERVER_SCRAPER_ENDPOINT: ${scraper_zeropsSubdomain}

  - setup: test
    extends: app

  - setup: scraper
    build:
      base: nodejs@22
      envVariables:
        MODE: scraper
        NODE_OPTIONS: --max_old_space_size=4096
      buildCommands:
        - pnpm i
        - pnpm build
      deployFiles:
        - dist/analog/server
        - node_modules
        - package.json
    run:
      base: nodejs@22
      envVariables:
        MY_SERVER_USER_ID: ${RAPIDKEY_USER_ID}
        MY_SERVER_RAPIDAPI_KEY: ${RAPIDAPI_KEY}
        MY_SERVER_S3_ENDPOINT: ${storage_apiUrl}
        MY_SERVER_S3_ACCESS_KEY: ${storage_accessKeyId}
        MY_SERVER_S3_SECRET_KEY: ${storage_secretAccessKey}
        MY_SERVER_S3_BUCKET_NAME: ${storage_bucketName}
      start: pnpm prod
      ports:
        - port: 3000
          httpSupport: true
